[project]
name = "decision-forecast"
version = "0.1.0"
description = "Multimodal financial forecasting with FNSPID dataset"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.27.0",
    "hydra-core>=1.3.6",
    "mlflow>=3.15.2",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.13.0",
    "tqdm>=4.68.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
