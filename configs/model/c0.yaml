# Model C0 — TimeXer + prototypes + mid fusion without cross-attn (Phase 3 / H2).
# Text is added to patch tokens; G_en is not used as a query to text.
name: c0
variant: timexer_mid_no_attn
fusion: mid_no_attn

d_model: 64
n_prototypes: 10
d_min: 0.5
n_heads: 4
e_layers: 2
d_ff: 256
dropout: 0.1
use_norm: false
use_prototypes: true

text_mlp:
  hidden: 64

head:
  hidden: 128

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
