# Model C0 — TimeXer + prototypes + mid fusion without cross-attn (Phase 3 / H2).
# OHLCV are multivariate PatchEmbed channels (same as B). Text enters once as
# per-patch add after proto(P); encoder exo=None; no text at the head.
name: c0
variant: timexer_mid_no_attn

fusion:
  kind: mid_no_attn
  text_at_head: false
  text_to_patches: true
  text_align: per_patch
  text_inject: add
  inject_layers: [0]
  text_as_exogenous: false

d_model: 64
n_prototypes: 10
d_min: 0.5
n_heads: 4
e_layers: 2
d_ff: 256
dropout: 0.1
use_norm: false
use_prototypes: true

head:
  hidden: 128

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
