# TimeXer on 5 OHLCV channels and 15D compact text.
# G_en reads the text, then each encoder layer writes that G_en back into the
# patches. Head pools the last patch. use_prototypes adds the TimeXL residual
# before the encoder; with it off the loss is Huber only.
name: c1_compact
variant: timexer_ohlcv_compact

fusion:
  kind: c1_compact
  text_at_head: false
  text_to_patches: false
  text_as_exogenous: true
  global_to_patch: true

d_model: 64
n_heads: 4
e_layers: 1
d_ff: 256
dropout: 0.1
text_dim: 15

use_prototypes: false
n_prototypes: 10
d_min: 0.5

head:
  pool: last
  type: linear
  hidden: 128
  dropout: 0.0

loss:
  kind: huber
  delta: 0.5
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
  gamma_dir: 0.0
  alpha_corr: 0.0
