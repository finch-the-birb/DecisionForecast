# TimeXer on close (channel 0) plus 25 selected indicators, with 15D text.
# 25 technical channels are endogenous patches together with close.
# Compact text is the only exogenous input: G_en reads it, then patches read
# G_en in the same layer. Head pools the last patch. No TimeXL prototypes.
name: timexer_selected
variant: timexer_40d

fusion:
  kind: selected_40d
  text_at_head: false
  text_to_patches: false
  text_as_exogenous: true
  global_to_patch: true

d_model: 64
n_heads: 4
e_layers: 1
d_ff: 256
dropout: 0.1
text_dim: 15

head:
  pool: last
  type: linear
  hidden: 128
  dropout: 0.0

loss:
  kind: huber
  delta: 0.5
  lambda_c: 0.0
  lambda_e: 0.0
  lambda_d: 0.0
