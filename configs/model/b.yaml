# Model B — TimeXer + prototypes + late fusion (Phase 2 / H1).
# OHLCV (close, volume, open, high, low) are multivariate PatchEmbed channels
# for B/C0/C1 — not exogenous tokens. The exo slot is reserved for text in C1.
name: b
variant: timexer_late

# One text entry: pooled ``text`` at the head. Encoder exo=None; text_seq unused.
fusion:
  kind: late
  text_at_head: true
  text_to_patches: false
  text_as_exogenous: false

d_model: 64
n_prototypes: 10
d_min: 0.5
n_heads: 4
e_layers: 2
d_ff: 256
dropout: 0.1
use_norm: false
use_prototypes: true

text_mlp:
  hidden: 64

head:
  hidden: 128

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
