# Model C1 — TimeXer + prototypes + mid fusion via G_en cross-attn (Phase 3 / H2).
# OHLCV are multivariate PatchEmbed channels. Text is the only exo (per_day tokens).
# Cross-attn query is the single G_en; no text at the head.
name: c1
variant: timexer_mid_cross_attn

fusion:
  kind: mid_cross_attn
  text_at_head: false
  text_to_patches: false
  text_as_exogenous: true
  exo_tokens: per_day          # per_day | per_patch

d_model: 64
n_prototypes: 10
d_min: 0.5
n_heads: 4
e_layers: 2
d_ff: 256
dropout: 0.1
use_norm: false
use_prototypes: true

head:
  pool: mean         # mean (default) | last | global | flatten
  type: linear       # linear | mlp
  hidden: 128
  dropout: 0.1

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
