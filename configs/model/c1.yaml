# Model C1 — TimeXer + prototypes + mid fusion via G_en cross-attn (Phase 3 / H2).
# Text is an extra exogenous variate token; G_en is the bridge.
name: c1
variant: timexer_mid_cross_attn
fusion: mid_cross_attn

d_model: 64
n_prototypes: 10
d_min: 0.5
n_heads: 4
e_layers: 2
d_ff: 256
dropout: 0.1
use_norm: false
use_prototypes: true

text_mlp:
  hidden: 64

head:
  hidden: 128

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
