# Model A — TimeXL baseline: 1D-CNN + prototypes + late fusion.
name: a
variant: timexl_cnn_late

fusion:
  kind: late
  text_at_head: true
  text_to_patches: false
  text_as_exogenous: false

d_model: 64
n_prototypes: 10
d_min: 0.5

cnn:
  channels: [32, 64, 64]
  kernel_size: 3

text_mlp:
  hidden: 64

head:
  pool: mean         # mean (default) | last | global | flatten
  type: linear       # linear | mlp
  hidden: 128
  dropout: 0.1

loss:
  kind: mse           # mse | huber | directional | correlation | huber_directional
  delta: 1.0          # for huber
  gamma_dir: 0.1      # directional penalty weight
  alpha_corr: 0.3     # correlation penalty weight
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
