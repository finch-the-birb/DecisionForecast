# Model A — TimeXL baseline: 1D-CNN + prototypes + late fusion.
name: a
variant: timexl_cnn_late

fusion:
  kind: late
  text_at_head: true
  text_to_patches: false
  text_as_exogenous: false

d_model: 64
n_prototypes: 10
d_min: 0.5

cnn:
  channels: [32, 64, 64]
  kernel_size: 3

text_mlp:
  hidden: 64

head:
  hidden: 128

loss:
  lambda_c: 0.1
  lambda_e: 0.1
  lambda_d: 0.01
