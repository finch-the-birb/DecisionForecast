text:
  enabled: true
  # Frozen finance embedding model (not FinBERT). Public ST, no HF_TOKEN.
  # Do not use gated FinLang/investopedia_embedding (401 without token).
  encoder: FinLang/finance-embeddings-investopedia
  encoder_url: https://huggingface.co/FinLang/finance-embeddings-investopedia
  dim: 768
  max_seq_tokens: 512
  encode_batch_size: 64
  article_field: Lsa_summary
  article_fallback: title          # skip | title  (article-level; not decay)
  daily_agg: mean
  missing_policy: decay            # zero | carry | decay  (day-level)
  decay_lambda: 0.03               # FNSPID: S_t = 3 + (S_0 - 3) e^{-0.03 t}
  neutral: train_mean              # zero | train_mean
  window_agg: recency_weighted     # last | mean | recency_weighted
  renormalize: false
  cache_dir: ${data.root}/cache/text_series

news_source: nasdaq_exteral_data
