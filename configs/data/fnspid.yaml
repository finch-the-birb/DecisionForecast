# FNSPID LTSF protocol — fixed temporal split, no leakage.
name: fnspid

# Resolve Data/ or data/ (legacy scripts use Data/FNSPID).
root: ${oc.env:FNSPID_ROOT,Data/FNSPID}

# Windowing (daily bars).
lookback_T: 60
patch_len: 12
patch_stride: 6
horizon: 7
horizons: [7, 14, 30]

features: [close, volume, open, high, low]
target: close
normalize: per_ticker_zscore

split:
  train_end: "2021-12-31"
  val_end: "2022-12-31"

tickers:
  dev:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - FB
    - NVDA
    - TSLA
    - JPM
    - BAC
