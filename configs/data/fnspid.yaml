text:
  enabled: true
  # Frozen encoder (SYSTEM.md): no joint LLM fine-tune.
  # Default is a finance *embedding* model, not FinBERT (which is a 3-class sentiment head).
  # Candidates / overrides:
  #   FinLang/finance-embeddings-investopedia  768-d  ~110M  public ST (this default; CC-BY-NC-4.0)
  #   FinLang/investopedia_embedding           gated 401 without HF_TOKEN — do not use
  #   BatuhanECB/FinModernBERT-embed-large-v1  1024-d  ~395M  FinMTEB STS/Summ; set dim=1024 prefix="passage: "
  #   sentence-transformers/all-MiniLM-L6-v2   384-d  general; set dim=384 prefix=""
  #   FinanceMTEB/FinE5                        ~7B    skip in core pipeline (VRAM)
  #   ProsusAI/finbert                         not an embedder — do not use here
  encoder: FinLang/finance-embeddings-investopedia
  dim: 768
  prefix: ""
  summary_field: Lsa_summary
  title_field: Article_title
  cache_dir: ${data.root}/cache/embeddings
  max_chars: 8000

news_source: nasdaq_exteral_data
