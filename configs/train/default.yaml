seed: 42
# multi-seed: -m train.seed=0,1,2
device: auto
batch_size: 32
epochs: 20
lr: 0.001
weight_decay: 0.0001
num_workers: 4  # CPU prefetch; Dataset stays on CPU (no CUDA in workers)
patience: 5
eval_every: 1
grad_clip: 1.0

# Use dev tickers by default; override with data.tickers.paper for main runs.
ticker_set: dev
max_train_windows: null  # null = all; set small int for smoke tests
max_val_windows: null
max_test_windows: null

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: decision-forecast
  log_model: false

metrics: [mse, mae]

proto:
  init: kmeans          # kmeans | random
  init_batches: 16
  project_every: 0      # >0 — project prototypes onto nearest train segments every k epochs
