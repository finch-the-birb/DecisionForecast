# @package _global_
# Forecasting article protocol: TimeXL × TimeXer on FNSPID (A/B/C0/C1, H1–H3).
defaults:
  - data: fnspid
  - model: a
  - train: default
  - explain: default
  - _self_

experiment:
  name: ${model.name}_T${data.lookback_T}_H${data.horizon}_s${train.seed}
  tags:
    - forecasting
    - fnspid
    - ${model.name}

paths:
  output_dir: ${hydra:runtime.output_dir}
  checkpoint_dir: ${paths.output_dir}/checkpoints

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
